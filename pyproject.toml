[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-intelligent-parser"
version = "0.1.0"
description = "MVP for parsing ship repair specification PDFs and chunking them for LLM use"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pdfplumber>=0.11.0",
  "pymupdf>=1.24.0",
]

[project.optional-dependencies]
ocr = [
  "pytesseract>=0.3.10",
  "Pillow>=10.0.0",
]

[project.scripts]
pdf-intelligent-parser = "pdf_intelligent_parser.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
